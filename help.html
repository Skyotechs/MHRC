    .article-nav { display: flex; justify-content: space-between; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200); gap: 1rem; }
    .article-nav a { display: flex; align-items: center; gap: .4rem; font-size: .875rem; font-weight: 600; color: var(--blue); text-decoration: none; }
    .article-nav a:hover { text-decoration: underline; }
    .article-nav svg { width: .85rem; height: .85rem; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

// ── ROUTING ──────────────────────────────────────────────────────
function getRoute() {
  const hash = location.hash.replace('#', '');
  if (!hash) return { view: 'hub' };
  const parts = hash.split('/');
  const catId = parts[0];
  const artId = parts[1];
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return { view: 'hub' };
  if (!artId) return { view: 'category', cat };
  const art = cat.articles.find(a => a.id === artId);
  if (!art) return { view: 'category', cat };
  return { view: 'article', cat, art };
}

function navigate(hash) {
  location.hash = hash || '';
  render();
  window.scrollTo(0, 0);
}

// ── RENDER ───────────────────────────────────────────────────────
function render() {
  const route = getRoute();
  const app = document.getElementById('app');
  const bc = document.getElementById('breadcrumb');
  const bci = document.getElementById('breadcrumb-inner');
  const sq = document.getElementById('search-input').value.trim();

  if (sq.length > 1) {
    renderSearch(app, sq);
    bc.style.display = 'none';
    return;
  }

  if (route.view === 'hub') {
    renderHub(app);
    bc.style.display = 'none';
  } else if (route.view === 'category') {
    renderCategory(app, route.cat);
    bc.style.display = '';
    bci.innerHTML = `<a href="#" onclick="navigate('');return false;">Help Center</a><span class="sep">›</span><span>${route.cat.name}</span>`;
  } else if (route.view === 'article') {
    renderArticle(app, route.cat, route.art);
    bc.style.display = '';
    bci.innerHTML = `<a href="#" onclick="navigate('');return false;">Help Center</a><span class="sep">›</span><a href="#${route.cat.id}" onclick="navigate('${route.cat.id}');return false;">${route.cat.name}</a><span class="sep">›</span><span>${route.art.title}</span>`;
  }
}

function renderHub(app) {
  app.innerHTML = `
    <div class="hub">
      <div class="hub-inner">
        <h2>All topics</h2>
        <div class="cat-grid">
          ${CATEGORIES.map(c => `
            <div class="cat-card" onclick="navigate('${c.id}')">
              <div class="cat-card-title"><span class="cat-card-icon">${c.icon}</span>${c.name}</div>
              <div class="cat-card-desc">${c.desc}</div>
              <span class="cat-card-link">See more <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderSidebar(activeCatId) {
  return `
    <aside class="sidebar">
      <div class="sidebar-title">All Topics</div>
      ${CATEGORIES.map(c => `
        <div class="sidebar-item ${c.id === activeCatId ? 'active' : ''}" onclick="navigate('${c.id}')">
          <span>${c.icon} ${c.name}</span>
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      `).join('')}
    </aside>
  `;
}

function renderCategory(app, cat) {
  app.innerHTML = `
    <div class="layout">
      ${renderSidebar(cat.id)}
      <main class="cat-view">
        <h1>${cat.icon} ${cat.name}</h1>
        <p class="cat-desc">${cat.desc}</p>
        <ul class="article-list">
          ${cat.articles.map(a => `
            <li>
              <a href="#${cat.id}/${a.id}" onclick="navigate('${cat.id}/${a.id}');return false;">
                ${a.title}
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
              </a>
            </li>
          `).join('')}
        </ul>
      </main>
    </div>
  `;
}

function renderArticle(app, cat, art) {
  const idx = cat.articles.indexOf(art);
  const prev = idx > 0 ? cat.articles[idx - 1] : null;
  const next = idx < cat.articles.length - 1 ? cat.articles[idx + 1] : null;

  app.innerHTML = `
    <div class="layout">
      ${renderSidebar(cat.id)}
      <main class="article-view">
        <h1>${art.title}</h1>
        <div class="article-meta">MHRC Help Center &nbsp;·&nbsp; ${cat.name}</div>
        <div class="article-body">${art.body}</div>
        <div class="article-nav">
          ${prev ? `<a href="#${cat.id}/${prev.id}" onclick="navigate('${cat.id}/${prev.id}');return false;"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> ${prev.title}</a>` : '<span></span>'}
          ${next ? `<a class="next" href="#${cat.id}/${next.id}" onclick="navigate('${cat.id}/${next.id}');return false;">${next.title} <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>` : '<span></span>'}
        </div>
      </main>
    </div>
  `;
}

function renderSearch(app, query) {
  const q = query.toLowerCase();
  const results = [];
  CATEGORIES.forEach(cat => {
    cat.articles.forEach(art => {
      const inTitle = art.title.toLowerCase().includes(q);
      const inBody = art.body.toLowerCase().replace(/<[^>]+>/g, '').includes(q);
      if (inTitle || inBody) {
        results.push({ cat, art, inTitle });
      }
    });
  });
  results.sort((a, b) => (b.inTitle ? 1 : 0) - (a.inTitle ? 1 : 0));

  app.innerHTML = `
    <div class="search-results">
      <h2>${results.length > 0 ? `${results.length} result${results.length !== 1 ? 's' : ''} for "${query}"` : `No results for "${query}"`}</h2>
      ${results.length === 0 ? `<p class="no-results">Try different keywords, or browse the topics above.</p>` : ''}
      ${results.map(r => `
        <div class="search-result-item" onclick="navigate('${r.cat.id}/${r.art.id}')">
          <h3>${r.art.title}</h3>
          <p>${r.cat.icon} ${r.cat.name}</p>
        </div>
      `).join('')}
    </div>
  `;
}

// ── SEARCH HANDLER ───────────────────────────────────────────────
function handleSearch(val) {
  if (val.length > 1) {
    render();
  } else if (val.length === 0) {
    render();
  }
}

// ── INIT ─────────────────────────────────────────────────────────
window.addEventListener('hashchange', render);
render();
</script>
